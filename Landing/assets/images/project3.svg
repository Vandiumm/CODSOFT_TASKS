<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="#FDF2F8"/>
  <!-- Top Bar -->
  <rect width="400" height="40" fill="#ffffff" />
  <circle cx="20" cy="20" r="5" fill="#EF4444" />
  <circle cx="35" cy="20" r="5" fill="#F59E0B" />
  <circle cx="50" cy="20" r="5" fill="#10B981" />
  <rect x="75" y="12" width="60" height="16" rx="4" fill="url(#pGrad3)"/>
  
  <!-- Left text, right food plate graphic -->
  <rect x="25" y="70" width="160" height="20" rx="4" fill="url(#pGrad3)" />
  <rect x="25" y="100" width="140" height="8" rx="4" fill="#F472B6" />
  <rect x="25" y="114" width="120" height="8" rx="4" fill="#F472B6" />
  <rect x="25" y="135" width="80" height="24" rx="12" fill="url(#pGrad3)" />
  
  <!-- Plate Graphic -->
  <g transform="translate(290, 115)">
    <circle cx="0" cy="0" r="45" fill="#ffffff" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.06))"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#FCE7F3" stroke-width="2" />
    <circle cx="-5" cy="-5" r="15" fill="url(#pGrad3)" />
    <circle cx="15" cy="10" r="10" fill="#10B981" />
    <circle cx="-12" cy="15" r="8" fill="#FBBF24" />
  </g>
  
  <!-- Menu Items below -->
  <rect x="25" y="185" width="105" height="50" rx="6" fill="#ffffff" />
  <rect x="147.5" y="185" width="105" height="50" rx="6" fill="#ffffff" />
  <rect x="270" y="185" width="105" height="50" rx="6" fill="#ffffff" />
</svg>
