<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Background Glows -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    
    <!-- Primary Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    
    <!-- Soft Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#111827" flood-opacity="0.12" />
    </filter>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="300" cy="250" r="220" fill="url(#bgGlow)" />
  <circle cx="150" cy="120" r="60" fill="url(#primaryGrad)" opacity="0.1" />
  <circle cx="480" cy="380" r="90" fill="url(#skyGrad)" opacity="0.08" />
  
  <!-- Floating Tech Elements -->
  <g transform="translate(480, 100) rotate(15)">
    <rect x="-25" y="-25" width="50" height="50" rx="12" fill="url(#skyGrad)" filter="url(#glowShadow)"/>
    <text x="0" y="8" font-family="'Poppins', sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <g transform="translate(100, 380) rotate(-10)">
    <rect x="-30" y="-30" width="60" height="60" rx="16" fill="url(#primaryGrad)" filter="url(#glowShadow)"/>
    <path d="M-12,-8 L12,-8 M-12,2 L12,2 M-12,12 L4,12" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Main Web Browser Card -->
  <g transform="translate(140, 100)" filter="url(#cardShadow)">
    <rect width="360" height="260" rx="16" fill="#ffffff" />
    <!-- Header -->
    <path d="M0,16 A16,16 0 0,1 16,0 L344,0 A16,16 0 0,1 360,16 L360,40 L0,40 Z" fill="#F3F4F6"/>
    <!-- Window controls -->
    <circle cx="20" cy="20" r="6" fill="#EF4444" />
    <circle cx="36" cy="20" r="6" fill="#F59E0B" />
    <circle cx="52" cy="20" r="6" fill="#10B981" />
    <rect x="80" y="12" width="160" height="16" rx="8" fill="#E5E7EB" />
    
    <!-- Code Panel Content -->
    <g transform="translate(20, 60)">
      <!-- Line 1 -->
      <rect x="0" y="0" width="40" height="12" rx="4" fill="#3B82F6" opacity="0.8"/>
      <rect x="48" y="0" width="80" height="12" rx="4" fill="#10B981" opacity="0.8"/>
      <!-- Line 2 -->
      <rect x="0" y="22" width="120" height="12" rx="4" fill="#111827" opacity="0.7"/>
      <rect x="128" y="22" width="50" height="12" rx="4" fill="#F59E0B" opacity="0.8"/>
      <!-- Line 3 (Nested) -->
      <rect x="20" y="44" width="90" height="12" rx="4" fill="#8B5CF6" opacity="0.8"/>
      <rect x="118" y="44" width="70" height="12" rx="4" fill="#EC4899" opacity="0.8"/>
      <!-- Line 4 (Nested) -->
      <rect x="20" y="66" width="140" height="12" rx="4" fill="#3B82F6" opacity="0.8"/>
      <!-- Line 5 -->
      <rect x="0" y="88" width="60" height="12" rx="4" fill="#10B981" opacity="0.8"/>
      
      <!-- Styled Wireframe Shapes in Browser -->
      <rect x="0" y="120" width="140" height="60" rx="8" fill="#F3F4F6" />
      <circle cx="30" cy="150" r="18" fill="url(#primaryGrad)" />
      <rect x="60" y="140" width="65" height="8" rx="4" fill="#E5E7EB" />
      <rect x="60" y="152" width="45" height="8" rx="4" fill="#E5E7EB" />

      <rect x="160" y="120" width="160" height="60" rx="8" fill="#F3F4F6" />
      <rect x="175" y="135" width="130" height="10" rx="5" fill="url(#skyGrad)" />
      <rect x="175" y="153" width="90" height="8" rx="4" fill="#E5E7EB" />
    </g>
  </g>

  <!-- Foreground Designer Card (overlapping for depth) -->
  <g transform="translate(80, 220)" filter="url(#cardShadow)">
    <rect width="200" height="180" rx="16" fill="#111827" />
    <!-- Header -->
    <path d="M0,16 A16,16 0 0,1 16,0 L184,0 A16,16 0 0,1 200,16 L200,36 L0,36 Z" fill="#1F2937"/>
    <!-- Details -->
    <circle cx="16" cy="18" r="5" fill="#374151" />
    <circle cx="30" cy="18" r="5" fill="#374151" />
    
    <!-- Design elements -->
    <g transform="translate(16, 52)">
      <text x="0" y="15" font-family="'Poppins', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Design System</text>
      
      <!-- Color Palette Circles -->
      <circle cx="12" cy="45" r="12" fill="#2563EB" />
      <circle cx="42" cy="45" r="12" fill="#38BDF8" />
      <circle cx="72" cy="45" r="12" fill="#F59E0B" />
      <circle cx="102" cy="45" r="12" fill="#10B981" />
      <circle cx="132" cy="45" r="12" fill="#8B5CF6" />

      <!-- Slider Control -->
      <rect x="0" y="78" width="168" height="6" rx="3" fill="#374151" />
      <rect x="0" y="78" width="100" height="6" rx="3" fill="url(#primaryGrad)" />
      <circle cx="100" cy="81" r="8" fill="#ffffff" filter="url(#glowShadow)"/>
      
      <!-- Progress Blocks -->
      <rect x="0" y="105" width="75" height="10" rx="5" fill="#1F2937" />
      <rect x="0" y="105" width="45" height="10" rx="5" fill="#38BDF8" />
      
      <rect x="90" y="105" width="75" height="10" rx="5" fill="#1F2937" />
      <rect x="90" y="105" width="60" height="10" rx="5" fill="#10B981" />
    </g>
  </g>

  <!-- Mobile Screen Mockup (for responsive indicator) -->
  <g transform="translate(420, 240)" filter="url(#cardShadow)">
    <rect width="110" height="200" rx="18" fill="#ffffff" stroke="#E5E7EB" stroke-width="4"/>
    <!-- Speaker & Camera -->
    <rect x="35" y="6" width="40" height="4" rx="2" fill="#E5E7EB" />
    <circle cx="85" cy="8" r="2.5" fill="#E5E7EB" />
    
    <!-- Home indicator -->
    <rect x="35" y="190" width="40" height="4" rx="2" fill="#E5E7EB" />
    
    <!-- Screen Content -->
    <g transform="translate(10, 20)">
      <!-- Hero -->
      <rect x="0" y="0" width="90" height="50" rx="8" fill="url(#primaryGrad)" />
      <!-- Content block 1 -->
      <rect x="0" y="60" width="90" height="10" rx="3" fill="#F3F4F6" />
      <rect x="0" y="75" width="60" height="8" rx="3" fill="#F3F4F6" />
      <!-- Card list -->
      <rect x="0" y="95" width="40" height="35" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
      <circle cx="20" cy="112" r="10" fill="#38BDF8" opacity="0.3"/>
      
      <rect x="50" y="95" width="40" height="35" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
      <circle cx="70" cy="112" r="10" fill="#2563EB" opacity="0.3"/>

      <!-- CTA Button -->
      <rect x="0" y="145" width="90" height="15" rx="7.5" fill="url(#primaryGrad)" />
    </g>
  </g>
</svg>
